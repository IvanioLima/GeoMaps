name: Publicar atualização

# Roda depois de cada "Compilar APK" bem-sucedido: publica o APK e o latest.json como release
# do repositório público IvanioLima/GeoMaps-releases (só binários). O app consulta
# https://github.com/IvanioLima/GeoMaps-releases/releases/latest/download/latest.json (sem login).
on:
  workflow_run:
    workflows: ["Compilar APK"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      DEST: IvanioLima/GeoMaps-releases
    steps:
      - name: Baixar o APK da compilação
        uses: actions/download-artifact@v4
        with:
          name: GeoMaps-apk
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: dist

      - name: Ler a versão do código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: src
          sparse-checkout: app/build.gradle.kts
          sparse-checkout-cone-mode: false

      - name: Montar latest.json
        env:
          RUN: ${{ github.event.workflow_run.run_number }}
          MSG: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          mkdir -p out
          cp dist/GeoMaps.apk out/GeoMaps.apk
          python3 - <<'PY'
          import hashlib, json, os
          data = open("out/GeoMaps.apk", "rb").read()
          run = int(os.environ["RUN"])
          import re
          ver = re.search(r'appVersion = "([^"]+)"', open("src/app/build.gradle.kts").read()).group(1)
          tag = f"v{ver}-b{run}"
          notes = "\n".join(l for l in os.environ.get("MSG", "").splitlines() if l.strip() and not l.startswith(("Co-Authored-By", "Claude-Session")))[:1500]
          info = {"versionCode": run, "versionName": f"{ver} (build {run})", "notes": notes,
                  "apk": f"https://github.com/{os.environ['DEST']}/releases/download/{tag}/GeoMaps.apk",
                  "sha256": hashlib.sha256(data).hexdigest(), "size": len(data)}
          json.dump(info, open("out/latest.json", "w"), ensure_ascii=False, indent=1)
          open("out/notes.md", "w").write(notes or "Nova versão do GeoMaps.")
          with open(os.environ["GITHUB_ENV"], "a") as f: f.write(f"TAG={tag}\n")
          print(json.dumps(info, ensure_ascii=False))
          PY

      - name: Publicar a release
        if: env.GH_TOKEN != ''
        run: |
          gh release delete "$TAG" --repo "$DEST" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" out/GeoMaps.apk out/latest.json --repo "$DEST" \
            --title "GeoMaps $TAG" --notes-file out/notes.md --latest
          # mantém só as 10 versões mais recentes
          gh release list --repo "$DEST" --limit 100 --json tagName --jq '.[10:][].tagName' | while read -r t; do
            gh release delete "$t" --repo "$DEST" --yes --cleanup-tag || true
          done

      - name: Aviso (segredo ausente)
        if: env.GH_TOKEN == ''
        run: echo "::warning::Crie o segredo RELEASES_TOKEN (token do GitHub com permissão Contents read/write no repositório GeoMaps-releases)."
