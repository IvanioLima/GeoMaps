name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar (debug)
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Renomear APK
        if: success()
        run: cp app/build/outputs/apk/debug/app-debug.apk GeoMaps.apk

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GeoMaps-apk
          path: GeoMaps.apk

      - name: Publicar versão (release) com o APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" GeoMaps.apk --title "GeoMaps build ${{ github.run_number }}" \
            --notes "APK gerado automaticamente a partir de ${GITHUB_SHA::7}. Instale o arquivo GeoMaps.apk no Android." || true

      - name: Relatório da compilação (issue "Relatório de compilação")
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --state all --search "Relatório de compilação in:title" --json number -q '.[0].number')
          if [ -z "$NUM" ]; then
            NUM=$(gh issue create --title "Relatório de compilação" --body "Resultados automáticos do GitHub Actions." | grep -oE '[0-9]+$')
          fi
          if [ -f GeoMaps.apk ]; then
            STATUS="✅ SUCESSO"
          else
            STATUS="❌ FALHA"
          fi
          {
            echo "## $STATUS — build ${{ github.run_number }} (${GITHUB_SHA::7})"
            echo
            if [ ! -f GeoMaps.apk ] && [ -f build.log ]; then
              echo '```'
              grep -E "^e: |error:|What went wrong|Could not|FAILURE|> Task .* FAILED|Execution failed|Unresolved|AAPT|resource .* not found" build.log | head -150 | cut -c1-400
              echo '```'
              echo '<details><summary>Final do log</summary>'
              echo
              echo '```'
              tail -80 build.log | cut -c1-400
              echo '```'
              echo '</details>'
            fi
          } > report.md
          gh issue comment "$NUM" --body-file report.md
