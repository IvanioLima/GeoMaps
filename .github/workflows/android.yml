name: Compilar e publicar

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # AAB para o Google Play + APK (mesma assinatura) para instalar à mão, se precisar
      - name: Compilar (release)
        run: gradle bundleRelease assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Separar arquivos
        if: success()
        run: |
          cp app/build/outputs/bundle/release/app-release.aab GeoMaps.aab
          cp app/build/outputs/apk/release/app-release.apk GeoMaps.apk

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GeoMaps-${{ github.run_number }}
          path: |
            GeoMaps.aab
            GeoMaps.apk

      # Envia para o teste interno do Google Play (só depois de criar o segredo PLAY_SERVICE_ACCOUNT
      # e de fazer o primeiro envio manual na Play Console)
      - name: Enviar ao Google Play (teste interno)
        if: success() && env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          packageName: br.geomaps.app
          releaseFiles: GeoMaps.aab
          track: internal
          status: completed

      - name: Relatório da compilação (issue "Relatório de compilação")
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --state all --search "Relatório de compilação in:title" --json number -q '.[0].number')
          if [ -z "$NUM" ]; then
            NUM=$(gh issue create --title "Relatório de compilação" --body "Resultados automáticos do GitHub Actions." | grep -oE '[0-9]+$')
          fi
          if [ -f GeoMaps.aab ]; then
            STATUS="✅ SUCESSO"
          else
            STATUS="❌ FALHA"
          fi
          {
            echo "## $STATUS — build ${{ github.run_number }} (${GITHUB_SHA::7})"
            echo
            if [ ! -f GeoMaps.aab ] && [ -f build.log ]; then
              echo '```'
              grep -E "^e: |error:|What went wrong|Could not|FAILURE|> Task .* FAILED|Execution failed|Unresolved|AAPT|resource .* not found" build.log | head -150 | cut -c1-400
              echo '```'
              echo '<details><summary>Final do log</summary>'
              echo
              echo '```'
              tail -80 build.log | cut -c1-400
              echo '```'
              echo '</details>'
            fi
          } > report.md
          gh issue comment "$NUM" --body-file report.md
